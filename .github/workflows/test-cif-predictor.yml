name: Validate CIF predictor boundaries

on:
  pull_request:
    paths:
      - "funasr/models/paraformer/cif_predictor.py"
      - "tests/test_cif_mixed_zero_fires.py"
      - ".github/workflows/test-cif-predictor.yml"
  push:
    branches: [main]
    paths:
      - "funasr/models/paraformer/cif_predictor.py"
      - "tests/test_cif_mixed_zero_fires.py"
      - ".github/workflows/test-cif-predictor.yml"

permissions:
  contents: read

jobs:
  cif-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU and ONNX test dependencies
        run: |
          python -m pip install torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest numpy==1.26.4 onnx==1.17.0 onnxruntime==1.23.2 --report install-report.json
      - name: Record environment and require ONNX dependencies
        run: |
          git rev-parse HEAD | tee source-commit.txt
          python -c "import onnx, onnxruntime; assert 'CPUExecutionProvider' in onnxruntime.get_available_providers()"
          python -m pip freeze | tee resolved-dependencies.txt
          python -m pip check | tee pip-check.txt
      - name: Validate mixed zero-fire batches, gradients and ONNX export
        run: |
          python -m pytest -q tests/test_cif_mixed_zero_fires.py --junitxml=cif-results.xml
          python -c "import xml.etree.ElementTree as E; r=E.parse('cif-results.xml').getroot(); assert len(list(r.iter('testcase')))==6; assert not any(list(r.iter(k)) for k in ['failure','error','skipped'])"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cif-boundary-evidence
          path: |
            resolved-dependencies.txt
            pip-check.txt
            cif-results.xml
            source-commit.txt
            install-report.json
